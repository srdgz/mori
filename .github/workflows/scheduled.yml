name: Scheduled jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Expire unpaid orders
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/expire-orders"
      - name: Move the demo orders
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/demo-orders"
